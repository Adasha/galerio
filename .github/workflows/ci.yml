name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - run: npm ci
      - run: composer install --no-interaction --no-progress

      - run: npm run lint:js
      - run: npm run lint:css
      - run: composer lint

  e2e:
    name: PHPUnit, Plugin Check and end-to-end tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - run: npm ci
      - run: composer install --no-interaction --no-progress
      - run: npx playwright install --with-deps chromium

      - name: Build blocks
        run: npm run build

      - name: Start WordPress
        run: npm run env:test:start

      - name: PHPUnit
        run: npm run test:php

      - name: Seed demo content
        run: npm run seed:test

      - name: Plugin Check
        run: npm run check:plugins

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7
